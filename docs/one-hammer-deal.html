<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>咸鱼铁匠铺</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: a night forge. The anvil scene fills the stage; the ledger (odds, hammer, market, seals) sits under it on phones and beside it on desktop. Single dark theme on purpose. */
:root{
  --bg:#120E0C; --panel:#1B1613; --panel2:#251E1A; --line:#3A2F28; --text:#F3E9DC; --dim:#A8988A;
  --ember:#FF7A1A; --gold:#F2C14E; --up:#E5483B; --down:#3FB37F; --seal:#C8102E;
  --o-brk:#E5483B; --o-dmg:#F08A3C; --o-keep:#6E6259; --o-succ:#8BD06A; --o-great:#F2C14E;
  --brush:"Ma Shan Zheng","Noto Serif SC",serif;
  --serif:"Noto Serif SC","Songti SC",serif;
  --sans:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* --top-safe grows in full-screen app webviews (TapTap) so the bar clears the camera hole and the host's floating buttons; see applyTopGap() */
:root{--top-safe:env(safe-area-inset-top,0px)}
#app{height:100%;display:flex;flex-direction:column;padding-top:var(--top-safe);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar{flex:none}
.scene{flex:none;height:max(230px,46vh)}
.ticker{display:none}
.sval .mk{margin-left:6px;font:700 13px var(--sans)}
.panel{flex:0 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}
@media (min-width:900px) and (min-aspect-ratio:1/1){
  #app{display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr)}
  .bar{grid-column:1/-1}
  .scene{height:auto}
  .panel{grid-row:2;grid-column:2;border-left:1px solid var(--line);border-top:0!important;overflow-y:auto}
}

.bar{display:flex;align-items:center;gap:8px;padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.stat{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.stat small{font-size:11px;color:var(--dim)}
.stat b{font:900 18px var(--serif);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat.gold b{color:var(--gold)}
.debt{flex:1;min-width:0;display:grid;gap:4px}
.debt .row{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--dim)}
.debt .row b{color:var(--text);font:700 13px var(--serif)}
.meter{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--ember),var(--gold));width:0;transition:width .3s}
.days{display:flex;gap:4px;margin-top:3px}
.days i{width:14px;height:4px;border-radius:2px;background:var(--line)}
.days i.on{background:var(--ember)}
.icon{appearance:none;background:var(--panel2);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;font-size:17px;cursor:pointer;flex:none}
#codexBtn{width:auto;min-width:38px;padding:0 6px}

.scene{position:relative;min-height:230px;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.sinfo{position:absolute;left:0;right:0;top:14px;display:grid;justify-items:center;gap:2px;pointer-events:none;text-align:center;padding:0 62px}
.sname{flex-wrap:wrap;justify-content:center}
.sname{display:flex;gap:8px;align-items:center;font:700 15px var(--serif)}
.tier{font:700 11px var(--sans);padding:2px 8px;border-radius:99px;border:1px solid currentColor}
.slevel.punch{animation:punch .28s cubic-bezier(.2,1.6,.4,1)}
@keyframes punch{0%{transform:scale(1.45)}100%{transform:scale(1)}}
.ticker{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;font:700 12px var(--sans);background:rgba(18,14,12,.7);border:1px solid var(--line);border-radius:8px;padding:4px 8px;pointer-events:none;font-variant-numeric:tabular-nums}
.combo{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:10px;text-align:right;pointer-events:none;font:900 28px/1 var(--serif);color:var(--gold);text-shadow:0 0 14px rgba(242,193,78,.6);opacity:0;transition:opacity .2s}
.combo small{display:block;font:700 10px var(--sans);letter-spacing:.2em;color:var(--dim)}
.combo.on{opacity:1}
.combo.bump{animation:punch .22s cubic-bezier(.2,1.6,.4,1)}
.slevel{font:900 54px/1 var(--serif);letter-spacing:.02em;text-shadow:0 0 24px rgba(255,122,26,.45);font-variant-numeric:tabular-nums}
.sval{font-size:13px;color:var(--dim)}
.sval b{color:var(--text);font:700 15px var(--serif)}
.pop{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);font:900 34px var(--serif);pointer-events:none;opacity:0;white-space:nowrap;text-shadow:0 2px 0 #000,0 0 18px currentColor}
.pop.go{animation:pop .9s ease-out forwards}
.pop.big{font-size:46px}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}70%{opacity:1;transform:translate(-50%,-62%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(18,14,12,.92);border:1px solid var(--line);padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}

.panel{background:var(--panel);border-top:1px solid var(--line);padding:12px max(14px,env(safe-area-inset-right,0px)) 14px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.panel>*{flex:none}
.odds{display:grid;gap:6px}
.owrap{position:relative;padding-top:7px}
.obar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--panel2);box-shadow:0 0 0 1px rgba(255,255,255,.06) inset}
.obar i{display:block;height:100%;transition:width .25s,filter .2s}
.obar i.hit{filter:brightness(1.7) saturate(1.3)}
.needle{position:absolute;top:0;left:0;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid #FFF6E0;transform:translateX(-7px);transition:left .13s cubic-bezier(.2,.9,.3,1.25);filter:drop-shadow(0 0 4px rgba(255,246,224,.9))}
.needle::after{content:"";position:absolute;left:-1px;top:0;width:2px;height:19px;background:#FFF6E0;opacity:.9}
.near{font:700 12px var(--sans);color:var(--gold);min-height:0}
.olegend{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;font-size:11px;color:var(--dim)}
.olegend span{display:grid;justify-items:center;line-height:1.25}
.olegend b{font:700 13px var(--serif);font-variant-numeric:tabular-nums}
.actions{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:10px}
.strike{appearance:none;border:0;border-radius:16px;background:linear-gradient(180deg,#FF8E35,#E2560F);color:#1A0E06;font:900 34px/1 var(--brush);min-height:98px;cursor:pointer;display:grid;place-items:center;align-content:center;gap:4px;box-shadow:0 4px 0 #8C3208,0 0 0 1px rgba(255,255,255,.08) inset;touch-action:none}
.strike small{font:700 12px var(--sans);color:rgba(26,14,6,.75)}
.strike:active{transform:translateY(2px);box-shadow:0 2px 0 #8C3208}
.strike:disabled{background:var(--panel2);color:var(--dim);box-shadow:none;cursor:default}
.strike:disabled small{color:var(--dim)}
.side{display:grid;gap:10px}
.sell,.rest{appearance:none;border-radius:14px;border:1px solid var(--line);background:var(--panel2);font:700 16px var(--sans);cursor:pointer;display:grid;place-items:center;align-content:center;padding:8px;gap:1px}
.sell{border-color:rgba(242,193,78,.55);color:var(--gold)}
.sell small{font:700 13px var(--serif);color:var(--text)}
.sell:disabled{opacity:.45;cursor:default}
.rest.hot{border-color:var(--ember);color:var(--ember);animation:breath 1.4s ease-in-out infinite}
@keyframes breath{50%{box-shadow:0 0 0 4px rgba(255,122,26,.18)}}

.market{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center}
.mhead{display:grid;line-height:1.2}
.mhead small{font-size:11px;color:var(--dim)}
.mhead b{font:900 22px var(--serif);font-variant-numeric:tabular-nums}
.mchg{font:700 12px var(--sans)}
.up{color:var(--up)}.down{color:var(--down)}
#mcv{width:100%;height:96px;display:block;grid-column:1/-1}
.mstats{display:grid;grid-template-columns:repeat(2,auto);gap:2px 12px;font-size:12px;color:var(--dim);justify-content:end}
.mstats b{color:var(--text);font:700 12px var(--serif);font-variant-numeric:tabular-nums}
.news{grid-column:1/-1;font-size:12px;color:var(--gold);min-height:0}
.mtip{grid-column:1/-1;font-size:11px;color:var(--dim)}

.seals{display:flex;flex-wrap:wrap;gap:6px;min-height:36px;align-items:center}
.seals .empty{font-size:12px;color:var(--dim)}
.seal{appearance:none;width:36px;height:36px;border-radius:6px;background:var(--seal);color:#FBE9D8;font:400 22px/1 var(--brush);display:grid;place-items:center;border:0;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(251,233,216,.35)}
.log{font-size:12px;color:var(--dim);display:grid;gap:2px;min-height:54px}
.log div:first-child{color:var(--text)}
.log .g{color:var(--o-great)}.log .s{color:var(--o-succ)}.log .b{color:var(--o-brk)}.log .d{color:var(--o-dmg)}.log .c{color:var(--gold)}

/* screens & modals */
.screen,.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:calc(24px + var(--top-safe)) max(18px,env(safe-area-inset-right,0px)) 24px max(18px,env(safe-area-inset-left,0px));overflow-y:auto}
.screen{background:radial-gradient(ellipse at 50% 85%,rgba(255,106,26,.28),transparent 60%),var(--bg)}
.modal{background:rgba(10,8,7,.78);backdrop-filter:blur(3px)}
.sheet{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:14px;box-shadow:0 30px 60px -20px #000}
.sheet h2{margin:0;font:900 24px var(--serif)}
.sheet p{margin:0;color:var(--dim)}
.lines{display:grid;gap:6px;font-size:14px}
.lines div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.lines b{font:700 15px var(--serif);font-variant-numeric:tabular-nums}
.btn{appearance:none;border:0;border-radius:12px;padding:13px 18px;font:700 16px var(--sans);background:var(--ember);color:#1A0E06;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.btns{display:grid;gap:10px}
.cards{display:grid;gap:10px}
.card{appearance:none;text-align:left;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.card:hover{border-color:var(--gold)}
.card .seal{grid-row:span 2;width:48px;height:48px;font-size:30px;cursor:inherit}
.card b{font:700 16px var(--serif)}
.card span{font-size:13px;color:var(--dim)}

.title{display:grid;justify-items:center;gap:18px;text-align:center;width:min(420px,100%)}
.logo{font:400 clamp(48px,15vw,100px)/1 var(--brush);white-space:nowrap;margin:0;color:#FBE9D8;text-shadow:0 0 30px rgba(255,122,26,.55),0 4px 0 #5A1F06}
.logo-seal{display:inline-grid;place-items:center;background:var(--seal);color:#FBE9D8;font:400 20px var(--brush);width:40px;height:40px;border-radius:6px;transform:rotate(-6deg)}
.tag{color:var(--dim);margin:0;letter-spacing:.3em}
.title .btns{width:100%}
.foot{font-size:11px;color:var(--dim)}
.shop{width:min(520px,100%);display:grid;gap:14px}
.shop header{display:flex;justify-content:space-between;align-items:center}
.shop h2{margin:0;font:900 26px var(--serif)}
.fame{font:900 20px var(--serif);color:var(--gold)}
.items{display:grid;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.item b{font:700 15px var(--serif)}
.item span{font-size:12px;color:var(--dim)}
.item .btn{grid-row:span 2;padding:9px 14px;font-size:14px}
.sec{font:700 12px var(--sans);color:var(--dim);letter-spacing:.2em;margin:6px 0 -4px}
.help{display:grid;gap:8px;font-size:14px;color:var(--text);margin:0;padding-left:1.2em}
.help li::marker{color:var(--ember)}
.actions{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.actions .rest{grid-column:1/-1;padding:10px;font-size:14px}
.store{appearance:none;border-radius:14px;border:1px solid var(--line);background:var(--panel2);font:700 16px var(--sans);cursor:pointer;display:grid;place-items:center;align-content:center;padding:8px;gap:1px}
.store small{font:500 12px var(--sans);color:var(--dim)}
.store:disabled{opacity:.45;cursor:default}
.buffs{display:flex;flex-wrap:wrap;gap:6px;min-height:0}
.buffs span{font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(242,193,78,.12);color:var(--gold);border:1px solid rgba(242,193,78,.35)}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--panel2);border-radius:12px;padding:4px}
.tabs button{appearance:none;border:0;background:transparent;border-radius:9px;padding:8px 4px;font:700 14px var(--sans);color:var(--dim);cursor:pointer;position:relative}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.tabs button .n{position:absolute;top:2px;right:6px;font:700 10px var(--sans);color:var(--gold)}
.pane{min-height:96px}
.rack{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{appearance:none;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:6px 6px 8px;display:grid;gap:2px;justify-items:center;cursor:pointer;min-width:0;font-family:var(--sans)}
.slot canvas{width:100%;height:38px;display:block}
.slot b{font:900 15px var(--serif);font-variant-numeric:tabular-nums}
.slot span{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slot.empty{border-style:dashed;cursor:default;align-content:center;min-height:86px;color:var(--dim);font-size:12px}
.bag{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:5px 12px 5px 5px;cursor:pointer;font:500 13px var(--sans)}
.chip i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#3B2C22;color:var(--gold);font:400 17px var(--brush)}
.chip.shopbtn{border-color:rgba(242,193,78,.5);color:var(--gold)}
.chip.shopbtn i{background:var(--gold);color:#1A0E06}
.bag .empty,.seals .empty{font-size:12px;color:var(--dim)}
.codex{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:420px){.codex{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cx{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 6px;display:grid;gap:2px;justify-items:center;text-align:center;min-width:0}
.cx canvas{width:100%;height:40px;display:block}
.cx b{font:700 13px var(--serif)}
.cx span{font-size:11px;color:var(--dim);line-height:1.35}
.cx.r1{border-color:rgba(79,166,227,.45)}.cx.r2{border-color:rgba(242,164,60,.6)}
.cx.lock b{color:var(--dim)}
.miles{display:grid;gap:6px}
.miles div{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:8px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--dim)}
.miles div.on{color:var(--gold);border-color:rgba(242,193,78,.45)}
.rar{font:700 11px var(--sans);padding:1px 7px;border-radius:99px;border:1px solid currentColor}
.shopitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.shopitem .chipi{grid-row:span 2;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#3B2C22;color:var(--gold);font:400 22px var(--brush)}
.shopitem b{font:700 15px var(--serif)}
.shopitem span{font-size:12px;color:var(--dim)}
.shopitem .btn{grid-row:span 2;padding:9px 12px;font-size:14px}
.big-sword{width:100%;height:70px;display:block;background:var(--panel2);border-radius:12px}
.rq{font:700 11px var(--sans);padding:1px 7px;border:1px solid;border-radius:99px;margin-right:6px}
.cgrade{display:grid;gap:8px;border:1px solid color-mix(in srgb,var(--rq) 45%,transparent);border-radius:14px;padding:10px;background:color-mix(in srgb,var(--rq) 6%,var(--bg))}
.chead{display:grid;gap:1px}
.chead b{font:900 16px var(--serif);color:var(--rq)}
.chead span{font-size:12px;color:var(--dim)}
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cgrade .cx{border-color:color-mix(in srgb,var(--rq) 50%,transparent)}
.cgrade .cx b{color:var(--rq)}
.cgrade .cx.lock b{color:var(--dim)}
.stars{letter-spacing:2px}
.stars i{font-style:normal;color:#4A403A}
.stars i.on{color:var(--gold)}
.codex{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)!important}
.fire{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim);flex-wrap:wrap}
.fire b{font:700 12px var(--sans);color:#FFB23F}
.fire .segs{display:flex;gap:3px}
.fire .segs i{width:14px;height:8px;border-radius:2px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line)}
.fire .segs i.on{background:linear-gradient(180deg,#FFD23F,#FF7A1A);box-shadow:0 0 6px rgba(255,170,40,.6)}
.fire.hot{background:linear-gradient(90deg,rgba(255,210,63,.18),rgba(255,122,26,.08));border:1px solid rgba(255,210,63,.55);border-radius:10px;padding:5px 10px;color:#FFE7A8;animation:breath 0.8s ease-in-out infinite}
.fire.hot b{color:#FFD23F;font-size:14px}
#app.fever .strike{background:linear-gradient(180deg,#FFE066,#FFA31A);box-shadow:0 4px 0 #A15C00,0 0 24px rgba(255,200,60,.65);animation:breath .6s ease-in-out infinite}
#app.fever .obar{box-shadow:0 0 0 2px rgba(255,210,63,.7),0 0 14px rgba(255,200,60,.5)}
.offer{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.offer .seal{grid-row:span 2;width:44px;height:44px;font-size:26px;cursor:default}
.offer b{font:700 15px var(--serif)}
.offer span{font-size:12px;color:var(--dim)}
.offer .btn{grid-row:span 2;padding:9px 12px;font-size:14px;white-space:nowrap}
.offer.loan{border-color:rgba(229,72,59,.5);background:rgba(229,72,59,.07)}
.offer.loan .seal{background:#5A1F1A}
.offer.bought{opacity:.5}
.gold-now{font:900 18px var(--serif);color:var(--gold)}
.fire.last{background:rgba(229,72,59,.14);border:1px solid rgba(255,106,77,.7);border-radius:10px;padding:5px 10px;color:#FFD0C4;animation:breath .5s ease-in-out infinite}
.fire.last b{color:#FF6A4D;font-size:14px}
#app.lastfever .strike{background:linear-gradient(180deg,#FF8A5B,#D93A1E);box-shadow:0 4px 0 #7A1A08,0 0 24px rgba(255,90,60,.6)}
#app.lastfever .obar{box-shadow:0 0 0 2px rgba(255,106,77,.8),0 0 14px rgba(255,90,60,.5)}
.regret{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:3;appearance:none;border:0;border-radius:99px;padding:11px 20px;font:700 15px var(--sans);color:#1A0E2A;background:linear-gradient(180deg,#E2C2FF,#A874F0);box-shadow:0 0 0 3px rgba(182,128,236,.35),0 6px 18px rgba(120,60,200,.45);cursor:pointer;animation:breath .9s ease-in-out infinite;white-space:nowrap}
.forms{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;font-size:10px;color:var(--dim)}
.forms i{font-style:normal;padding:1px 6px;border-radius:99px;border:1px solid var(--line)}
.forms i.on{color:#1A0E06;background:var(--gold);border-color:var(--gold)}
.forms i.top.on{background:linear-gradient(90deg,#FF8FD8,#FFE38A,#8FFFD2,#8FC8FF);border-color:transparent}
.cx[data-id]{cursor:pointer}
.cx[data-id]:hover,.cx[data-id]:focus-visible{border-color:var(--rq,var(--gold))}
.evotree{display:grid;gap:4px}
.evo{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:6px 10px;opacity:.75}
.evo.open{opacity:1;border-color:rgba(242,193,78,.5)}
.evo.top.open{border-color:transparent;background:linear-gradient(var(--panel2),var(--panel2)) padding-box,linear-gradient(90deg,#FF8FD8,#FFE38A,#8FFFD2,#8FC8FF) border-box;border:2px solid transparent}
.evo canvas{width:100%;height:96px;display:block}
.evo-t{display:grid;gap:2px;min-width:0}
.evo-t b{font:900 16px var(--serif)}
.evo-t span{font-size:12px;color:var(--dim)}
.evo-t span.ok{color:var(--o-succ)}
.evo-arrow{text-align:center;color:var(--gold);font-size:14px;line-height:1}
@media (max-height:760px) and (max-width:899px){.log{display:none}.strike{min-height:72px;font-size:30px}#mcv{height:34px}.mtip{display:none}.panel{gap:8px;padding-block:8px}.slevel{font-size:42px}.pane{min-height:86px}.actions .rest{padding:7px}}
.chk{display:flex;align-items:center;gap:8px;justify-content:center;font-size:14px;color:var(--text);margin:4px 0;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--ember)}
.btn.danger{color:#FF8A73;border-color:rgba(255,106,77,.45)}
#sheet .newshop{background:rgba(242,193,78,.12);border:1px solid rgba(242,193,78,.5);color:var(--gold);border-radius:12px;padding:10px 12px;font-weight:700}
/* 爱烤火的橘猫 (the studio) feeding corner */
.credit{appearance:none;border:0;background:none;color:#E8A35E;font:700 13px var(--sans);letter-spacing:.1em;cursor:pointer;padding:6px 10px;justify-self:center}
.catbox{position:relative;height:190px;display:grid;place-items:center;overflow:visible}
.cat{width:200px;height:190px}
.cat .eyes-happy,.cat .mouth-open{display:none}
.catbox.eat .eyes-open,.catbox.eat .mouth{display:none}
.catbox.eat .eyes-happy,.catbox.eat .mouth-open{display:inline}
.catbox.eat .cat{animation:chomp .5s ease}
.cat .tail{transform-origin:150px 160px;animation:tail 2.4s ease-in-out infinite}
@keyframes tail{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}
@keyframes chomp{0%{transform:scale(1)}30%{transform:scale(1.08,.94)}60%{transform:scale(.97,1.04)}100%{transform:scale(1)}}
.fishfly{position:absolute;left:50%;bottom:-40px;width:54px;margin-left:-27px;animation:fishfly .42s cubic-bezier(.3,.6,.4,1) forwards;pointer-events:none}
@keyframes fishfly{0%{transform:translateY(0) rotate(-30deg);opacity:.2}60%{opacity:1}100%{transform:translateY(-140px) rotate(20deg) scale(.6);opacity:0}}
.heart{position:absolute;top:30px;font-style:normal;color:#FF6B8B;font-size:26px;animation:heart 1.2s ease-out forwards;pointer-events:none}
@keyframes heart{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-70px) scale(1.2);opacity:0}}
.catline{text-align:center;min-height:2.6em;margin:4px 0}
.catcount{text-align:center;color:var(--gold);font-weight:700;margin:0}
/* first-run tutorial: spotlight + pointing hand + one line */
#tut{position:fixed;inset:0;z-index:19;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
#tut.isevo{background:rgba(8,6,5,.82);display:flex;align-items:center;justify-content:center;padding:16px;cursor:default}
.tut-hole{position:fixed;border-radius:16px;pointer-events:none;outline:2px solid rgba(255,214,120,.9);animation:tutRing 1.2s ease-in-out infinite;transition:left .25s,top .25s,width .25s,height .25s}
#tut.isevo .tut-hole,#tut.isevo .tut-hand,#tut.isevo .tut-tip{display:none}
@keyframes tutRing{0%,100%{outline-offset:0}50%{outline-offset:5px}}
.tut-hand{position:fixed;pointer-events:none;animation:tutTap 1s ease-in-out infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));transition:left .25s,top .25s}
.tut-hand svg{display:block}
.tut-hand.down svg{transform:rotate(180deg)}
.tut-hand.down{animation-name:tutTapDown}
@keyframes tutTap{0%,100%{transform:translateY(10px)}50%{transform:translateY(0)}}
@keyframes tutTapDown{0%,100%{transform:translateY(-10px)}50%{transform:translateY(0)}}
.tut-tip{position:fixed;pointer-events:none;text-align:center}
.tut-tip p{display:inline-block;margin:0;background:#FFF6E0;color:#1A0E06;font:800 17px/1.35 var(--sans);padding:10px 16px;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.tut-tip small{display:block;margin-top:8px;color:rgba(255,246,224,.75);font-size:12px}
.tut-skip{position:fixed;top:calc(12px + var(--top-safe));right:12px;appearance:none;border:1px solid rgba(255,246,224,.4);background:rgba(20,14,10,.75);color:#FFF6E0;font:700 13px var(--sans);padding:7px 14px;border-radius:99px;cursor:pointer}
.tut-dots{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom,0px));display:flex;gap:6px;justify-content:center;pointer-events:none}
.tut-dots i{width:7px;height:7px;border-radius:4px;background:rgba(255,246,224,.3)}
.tut-dots i.on{background:var(--gold);width:18px}
.tut-card{width:360px;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 16px;display:grid;gap:12px;text-align:center}
.tut-card h3{margin:0;font:900 20px var(--serif);color:var(--gold)}
.estrip{display:grid;gap:2px}
.erow{display:grid;grid-template-columns:46px minmax(0,1fr);align-items:center;column-gap:6px;background:rgba(0,0,0,.25);border-radius:12px;padding:2px 8px}
.erow .elv{grid-row:span 2;font:900 18px var(--serif);color:var(--gold);text-align:left}
.erow canvas{width:100%;height:58px;display:block}
.erow span{font-size:12px;color:var(--dim);text-align:center;margin-top:-2px;padding-bottom:3px}
.earr{font-style:normal;color:var(--gold);text-align:center;font-size:12px;line-height:1}
.help .estrip{margin:8px 0 2px -1.2em}
p.keys{color:var(--dim);font-size:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

// so leave room there. Detected as: touch screen, portrait, page as tall as the screen (no status bar or browser bars). Can be switched in Settings.
const IMMERSIVE = (matchMedia('(pointer:coarse)').matches && innerHeight > innerWidth && screen.height - innerHeight < 60) || /TapTap|TapMini/i.test(navigator.userAgent);
const topGapOn = () => (meta.topGap == null ? IMMERSIVE : !!meta.topGap);
function applyTopGap() {
  document.documentElement.style.setProperty('--top-safe', topGapOn() ? 'max(calc(env(safe-area-inset-top, 0px) + 40px), 78px)' : 'env(safe-area-inset-top, 0px)');
  window.dispatchEvent(new Event('resize'));
}
if (!DEMO) applyTopGap();
applyStatic();
if (DEMO) {
  meta.seenHelp = true; meta.muted = true;
  const qp = new URLSearchParams(location.search);
  if (qp.get('hb')) DIFF.hard.base = +qp.get('hb'); if (qp.get('hg')) DIFF.hard.growth = +qp.get('hg'); if (qp.get('hk')) DIFF.hard.brk = +qp.get('hk'); if (qp.get('hc') != null) DIFF.hard.sellCap = +qp.get('hc'); // balance sweeps
  hideScreens(); newRun('iron', qp.get('diff') === 'hard' ? 'hard' : 'easy'); if (!qp.get('plain')) run.relics.push('lian', 'yan');
  const w = new URLSearchParams(location.search).get('w'); run.sword = makeSword(WP[w] ? w : 'yu'); setTab('market');
  setInterval(demoTick, 380);
} else if (run) { showTitle(); render(); } else { showTitle(); if (!meta.asked && !meta.runs) welcome(); }
function welcome() {
  openSheet(`<h2>${T('欢迎来到咸鱼铁匠铺', 'Welcome to One Hammer Deal')}</h2><p>${T('第一次玩吗？', 'First time here?')}</p><div class="btns"><button class="btn" id="wNew" type="button">${T('我是新手，带我玩一遍', "I'm new, show me how")}</button><button class="btn ghost" id="wOld" type="button">${T('我是老手，直接开始', "I've played, let me in")}</button></div>`);
  $('#wNew').onclick = () => { meta.asked = true; saveMeta(); tutForce = true; startRun(); };
  $('#wOld').onclick = () => { meta.asked = true; meta.tutDone = true; saveMeta(); startRun(); };
}
window.__game = { maskKey, inLang, get run() { return run; }, get meta() { return meta; }, odds, quota, value, fmt, WEAPONS, drawIcon, render, renderWeapon, setLang, market, settle };
})();

</script>
